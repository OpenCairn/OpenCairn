name: Cross-platform tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  linux-full-suite:
    name: Linux full suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Codex renderings
        run: python .github/scripts/validate_codex_renderings.py --check

  archive-migration:
    name: Archive migration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install supported Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Run archive migration tests
        run: python -m unittest tests.test_archive_namespace_migration
