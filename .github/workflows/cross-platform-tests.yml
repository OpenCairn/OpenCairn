name: Cross-platform tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install supported Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Codex renderings
        run: python .github/scripts/validate_codex_renderings.py --check
